<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bank Game">
<title>The Self Love Bank Game</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <p class="wordmark">The Self Love Bank Game</p>
    <p class="byline">by The Grateful Deb</p>
    <h1 id="h1">Today</h1>
    <p class="sub" id="sub"></p>
  </header>
  <main id="main"></main>
  <div class="undo" id="undo" hidden></div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" data-tab="today">Today</button>
    <button type="button" data-tab="week">This Week</button>
    <button type="button" data-tab="bank">Bank</button>
  </nav>
</div>
<div class="veil" id="veil" hidden></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<script src="songbird.js"></script>
<script src="logic.js"></script>
<script src="coins.js"></script>
<script src="browser.js" data-tasks="tasks.json"></script>
<script src="app.js" data-plan="../plan.json" data-week="../week.json" data-asset="" data-sw="sw.js"></script>
</body>
</html>
