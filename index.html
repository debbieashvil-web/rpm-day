<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My RPM Day">
<meta name="theme-color" content="#FF8A00"><title>My RPM Day</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Nunito,system-ui,sans-serif;background:#FFFBF5;color:#222;padding:14px 14px 90px}
header{border-radius:22px;padding:16px 18px;color:#fff;background:linear-gradient(120deg,#FF2E63,#FF8A00,#FFC400,#12B76A,#1E90FF,#8E44EC)}
h1{font-family:Fredoka;font-size:28px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.tag{font-family:Fredoka;font-size:15px;opacity:.95}
.bar{height:14px;background:rgba(255,255,255,.35);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .4s}
.count{font-family:Fredoka;font-size:14px;margin-top:5px}
.rp{background:#FFF1DE;border:3px solid #FF8A00;border-radius:18px;padding:10px 14px;margin:12px 0;font-size:15px;line-height:1.35}
.rp b{color:#B35F00}
.sec{border-radius:20px;border:3px solid var(--c);background:var(--t);margin:12px 0;overflow:hidden}
.sec h2{background:var(--c);color:#fff;font-family:Fredoka;font-size:19px;padding:8px 14px}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:18px;font-weight:800;border-top:1px solid rgba(0,0,0,.05);cursor:pointer;user-select:none}
.ck{flex:none;width:34px;height:34px;border-radius:10px;border:3px solid var(--c);background:#fff;display:grid;place-items:center;font-size:22px;transition:transform .15s}
.it.done .ck{background:var(--c);color:#fff;transform:scale(1.1)}
.it.done .tx{text-decoration:line-through;opacity:.5}
.tm{font-family:Fredoka;color:var(--c);font-size:15px;min-width:42px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3B2E8C;color:#fff;font-family:Fredoka;padding:10px 18px;border-radius:30px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.send{display:block;width:100%;margin-top:14px;padding:16px;border:0;border-radius:18px;font-family:Fredoka;font-size:19px;color:#fff;background:linear-gradient(90deg,#8E44EC,#1E90FF)}
.boom{text-align:center;font-family:Fredoka;font-size:22px;margin:12px 0;display:none}
.tabs{display:flex;gap:8px;margin:12px 0 0}.tabs button{flex:1;padding:12px;border:3px solid #8E44EC;border-radius:16px;background:#fff;color:#8E44EC;font-family:Fredoka;font-size:17px}
.tabs button.on{background:#8E44EC;color:#fff}.ln{padding:10px 14px;font-size:16px;font-weight:800}.ln b{color:var(--c)}
.sg{font-size:12px;opacity:.7;padding:0 14px 8px}
</style></head><body>
<header><h1 id="t"></h1><div class="tag" id="g"></div><div class="bar"><i id="pb"></i></div><div class="count" id="c"></div></header>
<div class="tabs"><button id="tbT" class="on">☀️ Today</button><button id="tbC">📚 My Curriculum</button></div>
<div id="today"><div class="rp"><b>RESULT</b> <span id="r"></span><br><b>WHY</b> <span id="w"></span></div>
<div id="list"></div><div class="boom" id="boom">🎉 ALL DONE! You showed up! 💫</div>
<button class="send" id="send">💌 Send to Forgie</button></div>
<div id="cur" style="display:none"></div>
<div class="toast" id="toast"></div>
<script>
const FALLBACK={"date":"2026-10-23","title":"Fri Oct 23","tag":"Scary things first 🦁",
"result":"By candle lighting, the brave stuff is done, my room and Shabbat are ready, and I walk into Shabbos proud and calm. 🕯️",
"why":"Doing the scary things first means fear doesn't run my day. 💪",
"sections":[
{"name":"🦁 Scary Stuff First","color":"#FF2E63","tint":"#FFE9EF","items":[
["s1","12:00","YouTube stuff 🎥 (35 min)"],["s2","","Text D: re-up her 4-pack 📱"],["s3","","WhatsApp guitar lead: follow up 🎸"],["s4","","Text P: lesson follow-up 🎹"],["s5","","Chase letter + decide on AutoPay 💳"]]},
{"name":"💪 Body & Energy","color":"#FF8A00","tint":"#FFF1DE","items":[
["b1","7:30","Walk 🚶‍♀️"],["b2","8:15","Gym 🏋️‍♀️"],["b3","11:00","Breakfast & home 🍳"],["b4","1:00","Lunch 🥗"],["b5","2:00","Mobility flow 🧘‍♀️"]]},
{"name":"🎶 Music Practice","color":"#8E44EC","tint":"#F2E8FE","items":[
["m1","1:30","Piano 10 min 🎹"],["m2","1:40","Guitar 10 min 🎸"],["m3","1:50","Voice 10 min 🎤"]]},
{"name":"🛠️ My Space","color":"#E0A800","tint":"#FFF8D6","items":[["r1","2:20","Clean my room 🧹"],["r2","","Room repairs 🔧"]]},
{"name":"💰 Lesson","color":"#12B76A","tint":"#E3FBEF","items":[["l1","3:45","Leave for B's lesson 🚗"],["l2","4:00","B's lesson 🎹"]]},
{"name":"🕯️ Shabbat Ready","color":"#1E90FF","tint":"#E2F1FF","items":[["sh1","4:45","Shabbat chores ✨"],["sh2","5:45","Candle lighting 🕯️"]]}]}
;
// Webhook config arrives once via link: index.html#hook=URL&key=KEY -> saved on phone only, never in repo
(function(){const h=new URLSearchParams(location.hash.slice(1));
 if(h.get('hook')){localStorage.rpmHook=h.get('hook');localStorage.rpmKey=h.get('key')||'';history.replaceState(null,'',location.pathname)}})();
let P,S;
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
function save(){localStorage['rpm_'+P.date]=JSON.stringify(S)}
function all(){return P.sections.flatMap(s=>s.items)}
function label(id){const i=all().find(x=>x[0]==id);return i?i[2]:id}
function progress(){const n=all().length,d=all().filter(i=>S[i[0]]).length;
 $('pb').style.width=(100*d/n)+'%';$('c').textContent=d+' of '+n+' done';$('boom').style.display=d==n?'block':'none'}
async function ping(id,done){const hook=localStorage.rpmHook;if(!hook)return;
 const body=JSON.stringify({who:'Debbie',date:P.date,item:label(id),done,at:new Date().toLocaleString('en-US',{timeZone:'America/New_York'}),key:localStorage.rpmKey});
 try{await fetch(hook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body});}
 catch(e){const q=JSON.parse(localStorage.rpmQueue||'[]');q.push(body);localStorage.rpmQueue=JSON.stringify(q)}}
function render(){$('t').textContent='☀️ '+P.title;$('g').textContent=P.tag;$('r').textContent=P.result;$('w').textContent=P.why;
 $('list').innerHTML='';P.sections.forEach(s=>{const d=document.createElement('div');d.className='sec';
  d.style.setProperty('--c',s.color);d.style.setProperty('--t',s.tint);d.innerHTML='<h2>'+s.name+'</h2>';
  s.items.forEach(([id,tm,tx])=>{const r=document.createElement('div');r.className='it'+(S[id]?' done':'');
   r.innerHTML='<div class="ck">'+(S[id]?'✓':'')+'</div><div class="tm">'+tm+'</div><div class="tx">'+tx+'</div>';
   r.onclick=()=>{S[id]=!S[id];save();r.classList.toggle('done',S[id]);r.querySelector('.ck').textContent=S[id]?'✓':'';
    progress();if(navigator.vibrate)navigator.vibrate(20);toast(S[id]?(localStorage.rpmHook?'Yes! 🎉 Forgie knows':'Yes! 🎉 Saved'):'Unchecked');ping(id,S[id])};
   d.appendChild(r)});$('list').appendChild(d)});progress()}
$('send').onclick=async()=>{const d=all().filter(i=>S[i[0]]).map(i=>'✅ '+i[2]),l=all().filter(i=>!S[i[0]]).map(i=>'⬜ '+i[2]);
 const text='RPM '+P.title+'\n'+d.join('\n')+(l.length?'\n'+l.join('\n'):'');
 if(navigator.share){try{await navigator.share({text});return}catch(e){}}
 try{await navigator.clipboard.writeText(text);toast('Copied! Paste it to Forgie 💌')}catch(e){prompt('Copy this:',text)}};
(async()=>{try{P=await (await fetch('plan.json?'+Date.now())).json()}catch(e){P=FALLBACK}
 S=JSON.parse(localStorage['rpm_'+P.date]||'{}');render()})();

// ---- My Curriculum tab (content from curriculum.json) ----
let C,CS=JSON.parse(localStorage.rpm_cur||'{}');
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderCur(){const w=$('cur');w.innerHTML='';if(!C){w.innerHTML='<div class="rp">Loading… 🎶</div>';return}
 C.cards.forEach(c=>{const d=document.createElement('div');d.className='sec';d.style.setProperty('--c',c.color);d.style.setProperty('--t',c.tint);
  const n=c.skills.length,k=c.skills.filter(x=>CS[x[0]]).length;
  d.innerHTML='<h2>'+esc(c.name)+' <span style="float:right;font-size:15px">'+k+'/'+n+'</span></h2><div class="ln"><b>Now working on:</b> '+esc(c.now)+'</div>';
  c.skills.forEach(([id,tx])=>{const r=document.createElement('div');r.className='it'+(CS[id]?' done':'');
   r.innerHTML='<div class="ck">'+(CS[id]?'✓':'')+'</div><div class="tx">'+esc(tx)+'</div>';
   r.onclick=()=>{CS[id]=!CS[id];localStorage.rpm_cur=JSON.stringify(CS);if(navigator.vibrate)navigator.vibrate(20);toast(CS[id]?'Mastered! 🎉':'Unchecked');renderCur()};d.appendChild(r)});
  const x=document.createElement('div');x.className='ln';x.style.borderTop='1px solid rgba(0,0,0,.05)';x.innerHTML='<b>Next up:</b> '+esc(c.next);d.appendChild(x);
  w.appendChild(d)})}
function tab(c){$('today').style.display=c?'none':'';$('cur').style.display=c?'':'none';$('tbT').classList.toggle('on',!c);$('tbC').classList.toggle('on',c);localStorage.rpm_tab=c?'c':'t';if(c)renderCur()}
$('tbT').onclick=()=>tab(false);$('tbC').onclick=()=>tab(true);
(async()=>{try{C=await (await fetch('curriculum.json?'+Date.now())).json()}catch(e){C=null}renderCur()})();
if(localStorage.rpm_tab=='c')tab(true);
</script></body></html>
